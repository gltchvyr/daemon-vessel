name: Gl!tch Ears

on:
  pull_request:
    paths:
      - "daemon_vessel/ears.py"
      - "tests/test_ears.py"
      - "protocols/glitch-ears.md"
      - "pyproject.toml"
      - ".github/workflows/ears.yml"
  push:
    branches:
      - main
    paths:
      - "daemon_vessel/ears.py"
      - "tests/test_ears.py"
      - "protocols/glitch-ears.md"
      - "pyproject.toml"

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install vessel with ears
        run: python -m pip install -e '.[ears]'

      - name: Exercise Gl!tch Ears
        run: python -m unittest -v tests.test_ears
